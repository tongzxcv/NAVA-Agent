name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Authoritative Release Verification (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install ripgrep for E2E search
        shell: powershell
        run: choco install ripgrep -y --no-progress

      - name: Run authoritative verification gate
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release.ps1

      - name: Capture Windows E2E failure state
        if: failure()
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/capture-windows-e2e-diagnostics.ps1

      - name: Upload authoritative E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-windows-e2e-diagnostics
          if-no-files-found: warn
          path: |
            diagnostics/windows-e2e
            apps/desktop/test-results
            apps/desktop/playwright-report

  diagnose-e2e:
    name: Diagnose E2E (${{ matrix.test_file }})
    needs: verify
    if: ${{ always() && needs.verify.result == 'failure' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - desktop-dashboard.e2e.ts
          - desktop-mcp-client.e2e.ts
          - electron-security.e2e.ts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install ripgrep for E2E search
        shell: powershell
        run: choco install ripgrep -y --no-progress

      - name: Install dependencies
        shell: powershell
        run: corepack pnpm@10.15.0 install --frozen-lockfile

      - name: Build workspace type outputs
        shell: powershell
        run: corepack pnpm@10.15.0 typecheck

      - name: Run isolated E2E
        shell: powershell
        run: corepack pnpm@10.15.0 --filter @lnwjud/desktop test:e2e -- "e2e/${{ matrix.test_file }}"

      - name: Capture Windows E2E process state
        if: always()
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/capture-windows-e2e-diagnostics.ps1

      - name: Upload isolated E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-${{ matrix.test_file }}
          if-no-files-found: warn
          path: |
            diagnostics/windows-e2e
            apps/desktop/test-results
            apps/desktop/playwright-report
