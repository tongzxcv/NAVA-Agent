name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    # Fail closed: source-only pre-release tags must not publish local
    # development or unsigned public Windows installers.
    if: ${{ vars.NAVA_PUBLISH_SIGNED_WINDOWS_RELEASE == 'true' }}
    name: Verify & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag must match package.json version. Expected $expectedTag but got ${{ github.ref_name }}"
          }

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup .NET SDK 8 for Windows OCR
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install ripgrep for E2E search
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/ensure-ripgrep.ps1

      - name: Run authoritative verification gate
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release.ps1
        env:
          NAVA_OCR_PUBLISHER: ${{ vars.NAVA_OCR_PUBLISHER }}
          CSC_LINK: ${{ secrets.NAVA_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.NAVA_WINDOWS_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release & Upload Installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/installers/*.exe
            apps/desktop/dist/installers/*.blockmap
            apps/desktop/dist/installers/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
